# SearXNG settings for the AnonView proxy's private search backend.
#
# Mounted read-only into the OFFICIAL SearXNG container that docker-compose
# runs next to the app (`searxng` service). The proxy application itself never
# contains or starts SearXNG: it only calls this instance's JSON API over the
# private Docker network, and the container publishes no port to the host.
# The proxy sends the query alone — no cookies, headers or credentials of the
# visitor — and reduces the JSON answer to plain-text titles, snippets and
# http(s) links before it renders its own results page.
#
# The same file works for a SearXNG instance hosted anywhere else; point
# SEARCH_PROVIDER_URL at it (README §5).
#
# Only the keys below differ from SearXNG's defaults
# (https://docs.searxng.org/admin/settings/). Environment overrides used at
# runtime: SEARXNG_SECRET, SEARXNG_BIND_ADDRESS, SEARXNG_PORT.

use_default_settings: true

general:
  debug: false
  instance_name: "AnonView search"
  enable_metrics: false
  donation_url: false
  contact_url: false

search:
  safe_search: 1          # 0 none | 1 moderate | 2 strict
  autocomplete: ""
  formats:
    - html
    - json                # the proxy uses the JSON API

server:
  port: 8080
  # Inside its own container, on a Docker network that is not published; the
  # only client is the proxy (docker-compose also sets SEARXNG_BIND_ADDRESS).
  bind_address: "0.0.0.0"
  secret_key: "change-me-via-SEARXNG_SECRET"   # overridden by SEARXNG_SECRET
  limiter: false          # single trusted client (the proxy) — its own rate limit applies
  public_instance: false
  image_proxy: false
  method: "GET"

ui:
  static_use_hash: true

valkey:
  url: false

outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
  pool_connections: 50
  pool_maxsize: 10
  enable_http2: true
