# AnonView proxy — local Docker stack (development / self-hosting).
#
#   app      Node.js proxy (non-root, read-only filesystem, internal port only)
#   caddy    local TLS edge: HTTP on :80 by default; with DOMAIN set, automatic
#            Let's Encrypt certificates and HTTP→HTTPS redirect.
#   searxng  OPTIONAL private search backend (profile `searxng`): the OFFICIAL
#            SearXNG container image, internal network only, no published port,
#            reachable solely as http://searxng:8080 from `app`.
#
# Web search works out of the box without it: the app defaults to
# SEARCH_PROVIDER=bing, a keyless HTTPS call to Bing's RSS result feed — the
# same backend the Render deployment uses (render.yaml), so this stack
# behaves like production by default.
#
# To run the self-hosted metasearch backend instead:
#   SEARXNG_SECRET=... docker compose --profile searxng up -d
# and set in `.env`:  SEARCH_PROVIDER=searxng
#                     SEARCH_PROVIDER_URL=http://searxng:8080
#
# Configuration comes from `.env` (copy `.env.example`). Never commit `.env`.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: anonview-proxy:latest
    container_name: anonview-app
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8080"
      TRUST_PROXY: "true"
      DATA_DIR: /data
      # Web search: keyless, nothing to host. `.env` can override this with
      # SEARCH_PROVIDER=searxng + SEARCH_PROVIDER_URL=http://searxng:8080 when
      # the optional `searxng` profile is running.
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-bing}
      SEARCH_PROVIDER_URL: ${SEARCH_PROVIDER_URL:-}
    expose:
      - "8080"
    volumes:
      - app_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  searxng:
    # Optional: only started with `docker compose --profile searxng up`.
    profiles: ["searxng"]
    # Official image, pinned to a dated release (never `latest` — bump this
    # tag deliberately: https://hub.docker.com/r/searxng/searxng/tags).
    image: docker.io/searxng/searxng:2026.9.18-c0042add3
    container_name: anonview-searxng
    restart: unless-stopped
    environment:
      # Listen on the container's own interface inside the private network;
      # nothing publishes it to the host.
      SEARXNG_BIND_ADDRESS: "0.0.0.0"
      SEARXNG_PORT: "8080"
      SEARXNG_BASE_URL: http://searxng:8080/
      # Set SEARXNG_SECRET in .env (any long random string). Not `:?` — compose
      # interpolates the whole file even when this profile is not selected.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-set-SEARXNG_SECRET-in-dot-env}
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng_cache:/var/cache/searxng
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: anonview-caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # A domain enables automatic HTTPS; without one Caddy serves plain HTTP
      # on the server IP (testing only).
      SITE_ADDRESS: ${DOMAIN:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@${DOMAIN:-localhost}}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

volumes:
  app_data:
  searxng_cache:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
