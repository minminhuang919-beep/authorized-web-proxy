# Render Blueprint for the AnonView proxy — https://render.com/docs/blueprint-spec
#
# Deploy: Render Dashboard → New → Blueprint → select this repository. Render
# reads this file, creates the web service on the free plan, builds the
# Dockerfile and prompts for the secret values marked `sync: false`.
#
# Nothing secret is stored in this file.

services:
  - type: web
    name: anonview-proxy
    runtime: docker
    plan: free
    # region: frankfurt        # optional: oregon (default) | ohio | virginia | frankfurt | singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # The embedded SearXNG adds ~150 MB RSS; NODE_OPTIONS in the Dockerfile
    # caps Node's heap so both fit in the free plan's 512 MB.
    autoDeploy: true
    envVars:
      # ---- runtime (do not change) ------------------------------------------------
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: HOST
        value: 0.0.0.0
      # Render terminates TLS and forwards requests through its edge; trust its
      # X-Forwarded-* headers and use the edge-set client IP for rate limiting.
      - key: TRUST_PROXY
        value: "true"
      - key: CLIENT_IP_HEADER
        value: true-client-ip
      # The free plan's filesystem is ephemeral: keep admin-added scope entries
      # and blacklist entries in memory; PROXY_ALLOWED_DOMAINS / PROXY_BLACKLIST
      # (Environment tab) are the source of truth across restarts.
      - key: ADMIN_STORAGE
        value: memory
      - key: LOG_LEVEL
        value: info

      # ---- required: entered in the Render dashboard (never committed) ------------
      # `*` authorizes every website (blacklist + SSRF checks still apply).
      # Replace with a list such as example.com,*.example.com to restrict it.
      - key: PROXY_ALLOWED_DOMAINS
        value: "*"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD           # at least 12 characters (or set ADMIN_PASSWORD_HASH instead, see README)
        sync: false
      - key: SESSION_SECRET           # random 256-bit value generated by Render, persists across deploys
        generateValue: true

      # ---- limits (safe defaults for a 512 MB / shared-CPU free instance) ---------
      - key: RATE_LIMIT
        value: "300"
      - key: RATE_LIMIT_WINDOW
        value: "60"
      - key: ADMIN_RATE_LIMIT
        value: "10"
      - key: MAX_RESPONSE_SIZE
        value: 20m
      - key: MAX_REQUEST_SIZE
        value: 2m
      - key: REQUEST_TIMEOUT
        value: "30"
      - key: CONNECT_TIMEOUT
        value: "10"
      - key: TRANSFER_TIMEOUT
        value: "300"
      - key: MAX_CONCURRENT_UPSTREAM
        value: "32"

      # ---- behaviour --------------------------------------------------------------
      - key: PROXY_UNLISTED_URL_MODE  # direct | proxy
        value: direct
      - key: PROXY_SHOW_ALLOWLIST
        value: "true"
      - key: PROXY_BANNER
        value: "true"

      # ---- search box: shortcuts and web search -----------------------------------
      # Web search runs on a private SearXNG instance embedded in this same
      # container (Dockerfile + deploy/docker-entrypoint.sh): it binds to
      # 127.0.0.1 only, so it is never reachable from the internet and needs no
      # second Render service (the free plan has no private services). No API
      # key or card is required. Set SEARCH_PROVIDER=none to switch search off,
      # or brave/google/proxy with the extra variables described in README §5.
      - key: SEARCH_PROVIDER
        value: searxng
      - key: SEARXNG_URL
        value: http://127.0.0.1:8888
      - key: SEARXNG_EMBEDDED
        value: "true"
      - key: SEARXNG_PORT
        value: "8888"
      - key: SEARXNG_SECRET           # SearXNG's own secret key, generated once by Render
        generateValue: true
      - key: SEARCH_TIMEOUT
        value: "10"
      - key: SEARCH_RATE_LIMIT
        value: "60"
      # Optional: permanent site shortcuts (the admin "Sites" page can export
      # this value), format shortcut=destination|Name|Description, e.g.
      #   google=https://google.com|Google|Google Search,youtube=https://youtube.com|YouTube
      # Add it in the Environment tab, or uncomment to be prompted for it:
      # - key: PROXY_SITES
      #   sync: false
