# Render Blueprint for the AnonView proxy — https://render.com/docs/blueprint-spec
#
# Deploy: Render Dashboard → New → Blueprint → select this repository. Render
# reads this file, creates the web service on the free plan, builds the
# Dockerfile and prompts for the values marked `sync: false`.
#
# Nothing secret is stored in this file, and no destination is authorized by
# default: PROXY_ALLOWED_DOMAINS must be filled in with the domains you are
# authorized to proxy before any website can be opened.

services:
  - type: web
    name: anonview-proxy
    runtime: docker
    # Free instance type: 512 MB RAM, 0.1 CPU, spins down after 15 idle minutes.
    plan: free
    # region: frankfurt        # optional: oregon (default) | ohio | virginia | frankfurt | singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Deploy every push to the connected branch (replaces the deprecated
    # `autoDeploy: true`): https://render.com/docs/blueprint-spec#autodeploytrigger
    autoDeployTrigger: commit
    envVars:
      # ---- runtime (do not change) ------------------------------------------------
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: HOST
        value: 0.0.0.0
      # Render terminates TLS and forwards requests through its edge; trust its
      # X-Forwarded-* headers and use the edge-set client IP for rate limiting.
      - key: TRUST_PROXY
        value: "true"
      - key: CLIENT_IP_HEADER
        value: true-client-ip
      # The free plan's filesystem is ephemeral: keep admin-added scope entries
      # and blacklist entries in memory; PROXY_ALLOWED_DOMAINS / PROXY_BLACKLIST
      # (Environment tab) are the source of truth across restarts.
      - key: ADMIN_STORAGE
        value: memory
      - key: LOG_LEVEL
        value: info

      # ---- required: entered in the Render dashboard (never committed) ------------
      # The authorized scope: a comma-separated list of the domains you are
      # authorized to proxy, e.g. example.com,*.example.com,docs.example.org
      # (`*.` covers subdomains only, so list the bare domain too). Until it is
      # set, the proxy opens nothing and says so on its homepage. Do NOT enter
      # `*`: that authorizes every website and turns this into an open proxy.
      - key: PROXY_ALLOWED_DOMAINS
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD           # at least 12 characters (or set ADMIN_PASSWORD_HASH instead, see README)
        sync: false
      - key: SESSION_SECRET           # random 256-bit value generated by Render, persists across deploys
        generateValue: true

      # ---- limits (safe defaults for a 512 MB / shared-CPU free instance) ---------
      - key: RATE_LIMIT
        value: "300"
      - key: RATE_LIMIT_WINDOW
        value: "60"
      - key: ADMIN_RATE_LIMIT
        value: "10"
      - key: MAX_RESPONSE_SIZE
        value: 20m
      - key: MAX_REQUEST_SIZE
        value: 2m
      - key: REQUEST_TIMEOUT
        value: "30"
      - key: CONNECT_TIMEOUT
        value: "10"
      - key: TRANSFER_TIMEOUT
        value: "300"
      - key: MAX_CONCURRENT_UPSTREAM
        value: "32"

      # ---- behaviour --------------------------------------------------------------
      - key: PROXY_UNLISTED_URL_MODE  # direct | proxy
        value: direct
      - key: PROXY_SHOW_ALLOWLIST
        value: "true"
      - key: PROXY_BANNER
        value: "true"

      # ---- search box: shortcuts and web search -----------------------------------
      # Shortcuts and website addresses always work. Free-text web search needs
      # a search backend, which this service does NOT host: Render's free plan
      # is a single 512 MB / 0.1 CPU web service with no private services, and
      # running a metasearch engine (SearXNG) beside the proxy in that container
      # is not reliable — see README §11. Until a backend is configured the
      # results page says "Web search isn't set up yet"; everything else works.
      #
      # To enable search, add these in the Environment tab (README §5):
      #   SEARCH_PROVIDER=searxng  SEARCH_PROVIDER_URL=https://<your-searxng>/
      #     a SearXNG instance you host (any plan with private services, another
      #     provider, or your own machine) with `json` in its search.formats
      #   SEARCH_PROVIDER=brave    SEARCH_API_KEY=<key>
      #   SEARCH_PROVIDER=google   SEARCH_API_KEY=<key>  SEARCH_ENGINE_ID=<cx>
      #   SEARCH_PROVIDER=proxy    SEARCH_PROVIDER_URL=https://<search site>/?q={q}
      #     no API: the query is opened on that search website through the proxy;
      #     its host must be inside PROXY_ALLOWED_DOMAINS.
      - key: SEARCH_PROVIDER
        value: none
      - key: SEARCH_TIMEOUT
        value: "10"
      - key: SEARCH_RATE_LIMIT
        value: "60"
      # Optional: permanent site shortcuts (the admin "Sites" page can export
      # this value), format shortcut=destination|Name|Description, e.g.
      #   docs=https://docs.example.com|Docs|Documentation
      # Add it in the Environment tab, or uncomment to be prompted for it:
      # - key: PROXY_SITES
      #   sync: false
